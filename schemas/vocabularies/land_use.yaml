vocabulary: kelston.vocab.land_use
version: 1.0.0
description: >
  What a parcel of Kelston ground (or water, or canopy) is dedicated to.
  One parcel, one primary use; mixed-use is its own honest category.
ordered: false
terms:
  - code: residential
    label: Residential
    description: Dwellings and their gardens.
  - code: agricultural
    label: Agricultural
    description: Farms, commons gardens, orchards, paddies, and apiaries.
  - code: civic
    label: Civic
    description: Registry halls, schools, clinics, and assembly grounds.
  - code: commercial
    label: Commercial
    description: Shops, market halls, and workshops that trade with the public.
  - code: industrial
    label: Industrial
    description: Works yards, mills, and the composting and energy sites.
  - code: parkland
    label: Parkland
    description: Commons, groves, swim-ways, and protected wild edges.
  - code: mixed
    label: Mixed use
    description: Deliberately layered uses - shopfront below, dwellings above.
